; 模板文件：复制为 config.ini 后填入你自己的 Gemini API key
; Template: copy to config.ini and fill in your own Gemini API key.
; config.ini 只保存在本机，绝不提交到仓库（见 .gitignore）。
; 也可以用环境变量 GEMINI_API_KEY 代替配置文件里的 key。
; 首次运行没有 key 时，程序会弹出设置框让你填写。

[Gemini]
GEMINI_API_KEY =
GEMINI_MODEL = gemini-3.8-flash
GEMINI_EMBED_MODEL = gemini-embedding-001
GEMINI_TTS_MODEL = gemini-3.8-flash-tts
GEMINI_TTS_VOICE = Kore

[Knowledge]
CHUNK_SIZE = 1000
CHUNK_OVERLAP = 200
TOP_K = 3
DISTANCE_THRESHOLD = 0.45
